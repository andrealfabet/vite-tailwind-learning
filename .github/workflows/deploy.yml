name: Deploy to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "learnTailwind/**"

jobs:
  deploy:
    name: Trigger Vercel Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" | grep -q "^2" && echo "Deploy triggered successfully." || echo "Deploy hook returned non-2xx status."
